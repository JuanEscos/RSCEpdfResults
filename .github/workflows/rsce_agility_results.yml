name: RSCE Resultados diarios (PDF→JSON + FTPS)

on:
  schedule:
    - cron: '10 4 * * *'   # 04:10 UTC
  workflow_dispatch: {}

jobs:
  run-and-upload:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
      PY_SCRIPT: rsce_agility_pdf_to_json.py
      OUT_DIR: data/agility/processed
      FILE_PATTERN: 'resultados_*.json'
      # Cambia a 'true' SOLO si el servidor sigue fallando con la cadena TLS
      ALLOW_INSECURE_SSL: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh CA certificates
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo update-ca-certificates

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Asegura certifi disponible para el script
          python - << 'PY'
          import certifi, sys
          print("certifi.where() =", certifi.where(), file=sys.stderr)
          PY

      - name: Run scraper (PDF → JSON por año)
        run: |
          set -euo pipefail
          python "$PY_SCRIPT"

      - name: Collect outputs and build hashes
        id: collect
        run: |
          set -euo pipefail
          test -d "$OUT_DIR" || { echo "No existe $OUT_DIR"; exit 1; }
          mapfile -t FILES < <(find "$OUT_DIR" -type f -name "$FILE_PATTERN" | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No hay JSONs que subir"; exit 1
          fi
          printf "%s\n" "${FILES[@]}" > local_files.txt
          : > local_hashes.txt
          for f in "${FILES[@]}"; do
            sha256sum "$f" >> local_hashes.txt
          done
          echo "count=${#FILES[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts backup antes de FTP
        uses: actions/upload-artifact@v4
        with:
          name: rsce-resultados-json-${{ github.run_number }}
          path: |
            data/agility/processed/resultados_*.json
            local_files.txt
            local_hashes.txt
          retention-days: 10

      - name: Listar carpeta remota antes de subir
        env:
          FTP_SERVER:     ${{ secrets.FTP_SERVER }}
          FTP_USERNAME:   ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD:   ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          BASE="ftp://${FTP_SERVER}${FTP_REMOTE_DIR}/Competiciones/RSCE/data"
          curl --ssl-reqd --user "${FTP_USERNAME}:${FTP_PASSWORD}" "${BASE}/" -l || true

      - name: Subir JSONs por FTPS con reintentos
        env:
          FTP_SERVER:     ${{ secrets.FTP_SERVER }}
          FTP_USERNAME:   ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD:   ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail

          BASE="ftp://${FTP_SERVER}${FTP_REMOTE_DIR}/Competiciones/RSCE/data"

          upload_with_retries() {
            local FILE="$1"
            local NAME="$2"

            for attempt in 1 2 3 4 5; do
              echo "→ Subiendo ${NAME} intento ${attempt}/5"

              set +e
              curl --fail \
                   --ssl-reqd \
                   --ftp-create-dirs \
                   --disable-epsv \
                   --ftp-skip-pasv-ip \
                   --connect-timeout 60 \
                   --max-time 300 \
                   --retry 5 \
                   --retry-delay 20 \
                   --retry-max-time 300 \
                   --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                   --upload-file "$FILE" \
                   "${BASE}/${NAME}"

              rc=$?
              set -e

              if [ "$rc" -eq 0 ]; then
                echo "✅ Subido correctamente: ${NAME}"
                return 0
              fi

              echo "⚠️ Falló la subida de ${NAME}. Código curl: ${rc}"

              if [ "$attempt" -lt 5 ]; then
                echo "Esperando 60 segundos antes de reintentar..."
                sleep 60
              fi
            done

            echo "❌ No se pudo subir ${NAME} después de 5 intentos"
            return 1
          }

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            NAME="$(basename "$f")"
            upload_with_retries "$f" "$NAME"
          done < local_files.txt

      - name: Verificar subidas (descarga y compara hash)
        env:
          FTP_SERVER:     ${{ secrets.FTP_SERVER }}
          FTP_USERNAME:   ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD:   ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          BASE="ftp://${FTP_SERVER}${FTP_REMOTE_DIR}/Competiciones/RSCE/data"
          : > remote_hashes.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            NAME="$(basename "$f")"
            echo "← Descargando $NAME para verificar"
            curl --fail --ssl-reqd --disable-epsv --ftp-skip-pasv-ip \
                 --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                 --output "remote_${NAME}" \
                 "${BASE}/${NAME}"
            sha256sum "remote_${NAME}" >> remote_hashes.txt
          done < local_files.txt
          diff -q <(awk '{print $1}' local_hashes.txt) <(awk '{print $1}' remote_hashes.txt)
          echo "✔ Hash de todos los JSONs OK"

      - name: Upload artifacts backup
        uses: actions/upload-artifact@v4
        with:
          name: rsce-resultados-json-${{ github.run_number }}
          path: |
            data/agility/processed/resultados_*.json
            local_files.txt
            local_hashes.txt
            remote_hashes.txt
          retention-days: 10
